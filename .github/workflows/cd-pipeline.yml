name: CD Render

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Byte-compile
        run: python -m py_compile app.py renderer.py $(find libs -name '*.py')

      - name: Import smoke
        run: python -c "import app; print('app import ok')"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Render
        uses: docker/build-push-action@v6
        with:
          context: .
          file: config/prod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/barcode-gen-render:latest
            ghcr.io/${{ github.repository_owner }}/barcode-gen-render:${{ github.sha }}
