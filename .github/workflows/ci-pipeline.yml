name: CI

on:
  pull_request:
  push:
    branches: [main, master, staging]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: pip install -r requirements.txt

      - name: Byte-compile
        run: python -m py_compile app.py renderer.py $(find libs -name '*.py')

      - name: Import smoke
        run: python -c "import app; print('app import ok')"
